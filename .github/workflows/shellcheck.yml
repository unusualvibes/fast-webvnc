name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check installer
        run: |
          scripts/build-release.sh --check
          bash -n install.sh
          shellcheck --severity=style install.sh
          shellcheck -x --source-path=. --severity=style scripts/build-release.sh src/fast-webvnc.sh
      - name: Wayland backend tests
        run: bash scripts/test-wayland.sh
      - name: Dry-run smoke
        run: |
          python3 -m http.server 15900 --bind 127.0.0.1 >/tmp/fast-webvnc-smoke.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          sudo env FAST_WEBVNC_USER=test FAST_WEBVNC_PASSWORD='test-password' \
            ./install.sh install --dry-run --non-interactive \
            --hostname testpi.local --vnc-port 15900
